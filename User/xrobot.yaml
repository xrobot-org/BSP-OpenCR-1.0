modules:
  - module: xrobot-org/BlinkLED
    id: blink_led
    args:
      - led: LED1
      - blink_cycle: 250
  - module: xrobot-org/BuzzerAlarm
    id: buzzer_alarm
    args:
      - pwm: pwm_buzzer
      - alarm_freq: 1500
      - alarm_duration: 80
      - alarm_delay: 80
  - module: xrobot-org/ICM20948
    id: imu
    args:
      - cs_pin: IMU_CS
      - int_pin: IMU_INT
      - spi: spi1
      - database: database
      - ramfs: ramfs
      - param:
          data_rate: ICM20948::DataRate::DATA_RATE_1KHZ
          accl_range: ICM20948::AcclRange::RANGE_16G
          gyro_range: ICM20948::GyroRange::DPS_2000
          # 安装方向四元数 (w, x, y, z) / mounting rotation quaternion (w, x, y, z)
          rotation: '{1.0f, 0.0f, 0.0f, 0.0f}'
          gyro_topic_name: "icm20948_gyro"
          accl_topic_name: "icm20948_accl"
          task_stack_depth: 2048
  - module: xrobot-org/MadgwickAHRS
    id: ahrs
    args:
      - ramfs: ramfs
      - param:
          beta: 0.05f
          gyro_topic_name: "icm20948_gyro"
          accl_topic_name: "icm20948_accl"
          quaternion_topic_name: "ahrs_quaternion"
          euler_topic_name: "ahrs_euler"
          task_stack_depth: 2048
settings:
  monitor_sleep_ms: 1000
